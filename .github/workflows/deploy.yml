name: Deploy to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["v*"]

jobs:
  deploy:
    # 仅在配置了 CLOUDFLARE_API_TOKEN secret 时运行；
    # 手动部署可直接在本地执行 `pnpm run deploy`（见 README.zh-CN.md）。
    if: ${{ vars.DEPLOY_VIA_CI == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: ankane/setup-postgres@v1
        with:
          postgres-version: 16

      - name: Prepare database
        working-directory: server
        env:
          SQLALCHEMY_DATABASE_URI: postgresql+psycopg://postgres:@127.0.0.1:5432/sni
          ENVIRONMENT: LOCAL
          SATOSHI_REDIRECT: "false"
          API_KEY: ci-build-key
        run: |
          createdb sni
          uv sync
          uv run python -m alembic upgrade head
          uv run python cli.py content initialize

      - name: Start API server
        working-directory: server
        env:
          SQLALCHEMY_DATABASE_URI: postgresql+psycopg://postgres:@127.0.0.1:5432/sni
          ENVIRONMENT: LOCAL
          SATOSHI_REDIRECT: "false"
          API_KEY: ci-build-key
        run: |
          uv run uvicorn sni.main:app --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          echo "API failed to start" && exit 1

      - name: Build and deploy
        working-directory: client
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERCEL_ENV: preview
          MAP_DOMAIN: "false"
          API_URL: http://127.0.0.1:8000
          CDN_BASE_URL: https://cdn.nakamotoinstitute.org
          API_KEY: placeholder
        run: |
          bun install
          pnpm run deploy
